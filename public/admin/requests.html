<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Requests — Barangay PH Admin</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>
<div class="dash-shell">
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="dash-sidebar" id="dashSidebar"></aside>
  <div class="dash-main">
    <div class="dash-topbar" id="dashTopbar"></div>
    <div class="dash-content">
      <div class="panel">
        <div class="panel-head">
          <h2>Service Requests</h2>
          <div class="toolbar">
            <input type="search" id="searchInput" placeholder="Search resident or reference no.">
            <select id="serviceFilter"><option value="">All services</option></select>
            <select id="statusFilter">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
              <option value="ready_for_pickup">Ready for Pickup</option>
              <option value="released">Released</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Reference No.</th><th>Resident</th><th>Service</th><th>Status</th><th>Filed</th><th></th></tr></thead>
            <tbody id="requestsBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal-box">
    <button class="modal-close" id="closeModal">&times;</button>
    <h3 id="modalTitle">Request Detail</h3>
    <div class="detail-grid" id="modalDetails" style="margin-bottom:18px;"></div>
    <div class="field">
      <label for="modalStatus">Update status</label>
      <select id="modalStatus">
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="ready_for_pickup">Ready for Pickup</option>
        <option value="released">Released</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div class="field">
      <label for="modalNotes">Admin notes</label>
      <textarea id="modalNotes" placeholder="Optional note visible to the resident"></textarea>
    </div>
    <div class="form-message" id="modalMsg"></div>
    <button class="btn btn-primary btn-block" id="saveStatusBtn">Save Update</button>
  </div>
</div>

<script src="../assets/js/demo-data.js"></script>
<script src="../assets/js/api-client.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/dash-components.js"></script>
<script src="../assets/js/admin-requests.js"></script>
</body>
</html>
